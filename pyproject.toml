[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pyhectr"
version = "0.1.0"
description = "Tools for high-energy crystal truncation rod extraction and integration from detector images."
readme = "README.md"
requires-python = ">=3.10"

license = "GPL-2.0-or-later"
license-files = [
    "LICENSE",
    "THIRD_PARTY_NOTICES.md",
]

authors = [
  { name = "Radik Batraev" }
]
dependencies = [
  "numpy",
  "scipy",
  "matplotlib",
  "pillow",
  "imageio",
  "pandas",
  "tqdm",
  "opencv-python",
  "xrayutilities",
  "imageio-ffmpeg",
  "jupyterlab",
  "ipykernel",
  "seaborn",
]



[tool.ruff]
line-length = 110


[tool.hatch.build.targets.wheel]
packages = ["src/pyhectr"]


[project.urls]
Homepage = "https://github.com/batradiik/pyHECTR"
Repository = "https://github.com/batradiik/pyHECTR"
Issues = "https://github.com/batradiik/pyHECTR/issues"
